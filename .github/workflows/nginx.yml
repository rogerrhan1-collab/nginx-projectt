
name: Nginx Docker CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Files
        run: |
          ls -la
          test -f Dockerfile
          test -f index.html

      - name: Build Docker Image
        run: docker build -t nginx-project:latest .

      - name: Verify Docker Image
        run: docker images
